<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veresiye</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Veresiye">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
          --blue:#2563eb; --red:#dc2626; --green:#16a34a; --orange:#ea580c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#1a1d23; --text:#f3f4f6; --muted:#9ca3af; --line:#2a2e36; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text);
    font:17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 90px); }
  .wrap { max-width:560px; margin:0 auto; padding:12px 16px; }
  header { display:flex; align-items:center; gap:10px; margin:6px 0 14px; }
  header h1 { font-size:24px; margin:0; flex:1; }
  .icon-btn { border:0; background:var(--card); color:var(--text); width:44px; height:44px;
    border-radius:12px; font-size:21px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .card { background:var(--card); border-radius:16px; padding:16px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .total { text-align:center; margin-bottom:12px; }
  .total .lbl { color:var(--muted); font-size:15px; }
  .total .big { font-size:34px; font-weight:700; color:var(--red); }
  .total .small { color:var(--muted); font-size:14px; }
  input, textarea { width:100%; font:inherit; color:var(--text); background:var(--card);
    border:1.5px solid var(--line); border-radius:12px; padding:13px 14px; outline:none; }
  input:focus { border-color:var(--blue); }
  .search { margin-bottom:10px; }
  .list { background:var(--card); border-radius:16px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .row { display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row:last-child { border-bottom:0; }
  .avatar { width:42px; height:42px; border-radius:50%; background:#dbeafe; color:#1d4ed8;
    display:flex; align-items:center; justify-content:center; font-weight:700; flex:none; }
  .row .mid { flex:1; min-width:0; }
  .row .name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .sub { color:var(--muted); font-size:14px; }
  .row .sub.old { color:var(--orange); font-weight:600; }
  .amt { font-weight:700; white-space:nowrap; }
  .amt.debt { color:var(--red); } .amt.zero { color:var(--muted); font-weight:500; } .amt.credit { color:var(--green); }
  .empty { text-align:center; color:var(--muted); padding:34px 16px; }
  .fab { position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 16px);
    max-width:528px; margin:0 auto; border:0; border-radius:16px; padding:17px; font:inherit;
    font-weight:700; font-size:18px; color:#fff; background:var(--blue); box-shadow:0 6px 18px rgba(37,99,235,.35); }
  .back { border:0; background:none; color:var(--blue); font:inherit; padding:8px 0; font-size:17px; }
  .cust-head { text-align:center; margin:4px 0 14px; }
  .cust-head h2 { margin:0; font-size:24px; }
  .cust-head .phone { color:var(--muted); }
  .balance { font-size:38px; font-weight:800; margin:8px 0 2px; }
  .balance.debt { color:var(--red); } .balance.zero { color:var(--green); } .balance.credit { color:var(--green); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .btn { border:0; border-radius:14px; padding:16px 10px; font:inherit; font-weight:700; color:#fff; width:100%; }
  .btn.red { background:var(--red); } .btn.green { background:var(--green); } .btn.blue { background:var(--blue); }
  .btn.light { background:var(--card); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.08); font-weight:600; }
  .btn.wa { background:#25d366; }
  .btn:disabled { opacity:.45; }
  h3 { font-size:15px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:22px 4px 8px; }
  .entry { display:flex; gap:12px; align-items:center; padding:13px 16px; border-bottom:1px solid var(--line); }
  .entry:last-child { border-bottom:0; }
  .entry .mid { flex:1; min-width:0; }
  .entry .note { font-weight:500; }
  .entry .date { color:var(--muted); font-size:14px; }
  .del { border:0; background:none; color:var(--muted); font-size:18px; padding:4px 2px 4px 8px; }
  .links { display:flex; justify-content:center; gap:22px; margin:22px 0 8px; }
  .link { border:0; background:none; color:var(--muted); font:inherit; font-size:15px; text-decoration:underline; }
  .link.danger { color:var(--red); }
  /* alttan açılan pencere */
  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:flex-end; justify-content:center; z-index:10; }
  .sheet-bg.open { display:flex; }
  .sheet { background:var(--bg); width:100%; max-width:560px; border-radius:20px 20px 0 0;
    padding:18px 16px calc(env(safe-area-inset-bottom) + 18px); max-height:92vh; overflow:auto; }
  .sheet h2 { margin:0 0 14px; font-size:21px; text-align:center; }
  .field { margin-bottom:12px; }
  .field label { display:block; color:var(--muted); font-size:14px; margin:0 4px 5px; }
  .money { font-size:32px; font-weight:700; text-align:center; }
  .quick { display:flex; flex-wrap:wrap; gap:8px; margin:-2px 0 12px; }
  .chip { border:1.5px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; padding:8px 13px; font:inherit; font-size:15px; }
  .hint { color:var(--muted); font-size:14px; text-align:center; margin:10px 4px 0; }
  .toast { position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 90px); max-width:528px; margin:0 auto;
    background:#111827; color:#fff; border-radius:14px; padding:13px 16px; display:none; align-items:center; gap:10px; z-index:20; }
  .toast.show { display:flex; }
  .toast span { flex:1; }
  .toast button { border:0; background:none; color:#93c5fd; font:inherit; font-weight:700; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ANA EKRAN: müşteri listesi -->
  <section id="home">
    <header>
      <h1>📒 Veresiye</h1>
      <button class="icon-btn" onclick="openSettings()" aria-label="Ayarlar">⚙️</button>
    </header>
    <div class="card total">
      <div class="lbl">Toplam alacağın</div>
      <div class="big" id="totalAmt">0 ₺</div>
      <div class="small" id="totalSub"></div>
    </div>
    <input class="search" id="search" type="search" placeholder="🔍 Müşteri ara" oninput="renderHome()">
    <div class="list" id="custList"></div>
  </section>

  <!-- MÜŞTERİ EKRANI -->
  <section id="cust" class="hidden">
    <button class="back" onclick="goHome()">‹ Müşteriler</button>
    <div class="cust-head">
      <h2 id="cName"></h2>
      <div class="phone" id="cPhone"></div>
      <div class="balance" id="cBal"></div>
      <div class="small" id="cBalLbl" style="color:var(--muted)"></div>
    </div>
    <div class="two">
      <button class="btn red" onclick="openEntry('borc')">➕ Borç yaz</button>
      <button class="btn green" onclick="openEntry('odeme')">✅ Ödeme al</button>
    </div>
    <div class="two">
      <button class="btn wa" id="waBtn" onclick="sendWhatsApp()">💬 Hatırlat</button>
      <button class="btn light" id="callBtn" onclick="callCust()">📞 Ara</button>
    </div>
    <h3>Hesap hareketleri</h3>
    <div class="list" id="entries"></div>
    <div class="links">
      <button class="link" onclick="openCustForm(true)">✏️ Düzenle</button>
      <button class="link danger" onclick="deleteCust()">🗑️ Müşteriyi sil</button>
    </div>
  </section>
</div>

<button class="fab" id="fab" onclick="openCustForm(false)">+ Yeni müşteri</button>

<!-- Pencere: yeni müşteri / düzenle -->
<div class="sheet-bg" id="custSheet" onclick="if(event.target===this)closeSheets()">
  <div class="sheet">
    <h2 id="custSheetTitle">Yeni müşteri</h2>
    <div class="field"><label>Adı</label><input id="fName" placeholder="Örn: Ahmet Yılmaz" autocomplete="off" autocapitalize="words"></div>
    <div class="field"><label>Telefonu (WhatsApp için, isteğe bağlı)</label><input id="fPhone" type="tel" inputmode="tel" placeholder="05xx xxx xx xx"></div>
    <div class="field" id="firstDebtField"><label>Şu anki borcu (isteğe bağlı)</label><input id="fDebt" inputmode="decimal" placeholder="0 ₺"></div>
    <button class="btn blue" onclick="saveCust()">Kaydet</button>
    <button class="btn light" style="margin-top:10px" onclick="closeSheets()">Vazgeç</button>
  </div>
</div>

<!-- Pencere: borç yaz / ödeme al -->
<div class="sheet-bg" id="entrySheet" onclick="if(event.target===this)closeSheets()">
  <div class="sheet">
    <h2 id="entryTitle"></h2>
    <div class="field"><input id="eAmt" class="money" inputmode="decimal" placeholder="0 ₺"></div>
    <div class="quick" id="payAll"></div>
    <div class="field"><input id="eNote" placeholder="Not (isteğe bağlı) — örn: ekmek, süt"></div>
    <div class="field"><label>Tarih</label><input id="eDate" type="date"></div>
    <button class="btn" id="entrySave" onclick="saveEntry()">Kaydet</button>
    <button class="btn light" style="margin-top:10px" onclick="closeSheets()">Vazgeç</button>
  </div>
</div>

<!-- Pencere: ayarlar -->
<div class="sheet-bg" id="setSheet" onclick="if(event.target===this)closeSheets()">
  <div class="sheet">
    <h2>Ayarlar</h2>
    <div class="field"><label>İşletmenin adı (hatırlatma mesajında görünür)</label>
      <input id="sShop" placeholder="Örn: Yılmaz Market" onchange="saveShop()"></div>
    <button class="btn blue" onclick="exportBackup()">💾 Yedek al</button>
    <button class="btn light" style="margin-top:10px" onclick="document.getElementById('importFile').click()">📂 Yedeği geri yükle</button>
    <input type="file" id="importFile" accept=".json,application/json" class="hidden" onchange="importBackup(this)">
    <p class="hint">Bilgiler sadece bu telefonda saklanır. Ayda bir “Yedek al” ile dosyayı kaydet, telefon değişirse geri yükle.</p>
    <button class="btn light" style="margin-top:14px" onclick="closeSheets()">Kapat</button>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn">Geri al</button></div>

<script>
// ---- Veri: tek anahtar, tutarlar kuruş cinsinden tam sayı ----
const KEY = "veresiye-v1";
let db = { shop: "", customers: [] };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.customers)) db = s; } catch (e) {}
function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
let current = null;      // açık müşterinin id'si
let entryType = "borc";
let editing = false;

function parseMoney(str) {   // "1.250,50" / "1250.5" / "1250" → kuruş
  let s = String(str || "").replace(/[^\d.,]/g, "");
  if (!s) return 0;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if (/\.\d{3}$/.test(s)) s = s.replace(/\./g, "");   // "1.250" binlik ayraç
  const n = Math.round(parseFloat(s) * 100);
  return isFinite(n) && n > 0 ? n : 0;
}
function fmt(k) {
  const tl = Math.abs(k) / 100;
  return tl.toLocaleString("tr-TR", { minimumFractionDigits: k % 100 ? 2 : 0, maximumFractionDigits: 2 }) + " ₺";
}
function balance(c) { return c.entries.reduce((s, e) => s + (e.type === "borc" ? e.amount : -e.amount), 0); }
function lastDate(c) { return c.entries.reduce((m, e) => e.date > m ? e.date : m, ""); }
function daysAgo(iso) { return iso ? Math.round((new Date(today()) - new Date(iso)) / 864e5) : null; }
function dayText(n) { return n === 0 ? "bugün" : n === 1 ? "dün" : n + " gün önce"; }
function niceDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: y === new Date().getFullYear() ? undefined : "numeric" });
}
function cust() { return db.customers.find(c => c.id === current); }
function initials(n) { return n.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toLocaleUpperCase("tr-TR"); }
function esc(s) { return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }

// ---- Ana ekran ----
function renderHome() {
  const q = $("search").value.trim().toLocaleLowerCase("tr-TR");
  const list = db.customers.map(c => ({ c, b: balance(c), d: lastDate(c) }))
    .filter(x => !q || x.c.name.toLocaleLowerCase("tr-TR").includes(q) || (x.c.phone || "").includes(q))
    .sort((a, b) => (b.b > 0) - (a.b > 0) || b.b - a.b || (b.d > a.d ? 1 : -1));
  const total = db.customers.reduce((s, c) => s + Math.max(0, balance(c)), 0);
  const owing = db.customers.filter(c => balance(c) > 0).length;
  $("totalAmt").textContent = fmt(total);
  $("totalSub").textContent = db.customers.length ? `${owing} kişide borç var · ${db.customers.length} müşteri` : "";
  if (!db.customers.length) {
    $("custList").innerHTML = `<div class="empty">Henüz müşteri yok.<br>Aşağıdaki <b>+ Yeni müşteri</b> düğmesine dokun.</div>`;
    return;
  }
  if (!list.length) { $("custList").innerHTML = `<div class="empty">“${esc($("search").value)}” bulunamadı.</div>`; return; }
  $("custList").innerHTML = list.map(({ c, b, d }) => {
    const n = daysAgo(d);
    const old = b > 0 && n !== null && n >= 30;
    const sub = n === null ? "Kayıt yok" : (old ? "⏰ " : "") + "Son işlem " + dayText(n);
    const cls = b > 0 ? "debt" : b < 0 ? "credit" : "zero";
    const txt = b > 0 ? fmt(b) : b < 0 ? "+" + fmt(b) : "Borcu yok";
    return `<div class="row" onclick="openCust('${c.id}')">
      <div class="avatar">${esc(initials(c.name))}</div>
      <div class="mid"><div class="name">${esc(c.name)}</div><div class="sub ${old ? "old" : ""}">${sub}</div></div>
      <div class="amt ${cls}">${txt}</div></div>`;
  }).join("");
}

// ---- Müşteri ekranı ----
function openCust(id) { current = id; show("cust"); renderCust(); window.scrollTo(0, 0); }
function goHome() { current = null; show("home"); renderHome(); }
function show(which) {
  $("home").classList.toggle("hidden", which !== "home");
  $("cust").classList.toggle("hidden", which !== "cust");
  $("fab").classList.toggle("hidden", which !== "home");
}
function renderCust() {
  const c = cust(); if (!c) return goHome();
  const b = balance(c);
  $("cName").textContent = c.name;
  $("cPhone").textContent = c.phone || "Telefon eklenmemiş";
  $("cBal").textContent = b === 0 ? "Borcu yok ✓" : fmt(b);
  $("cBal").className = "balance " + (b > 0 ? "debt" : b < 0 ? "credit" : "zero");
  $("cBalLbl").textContent = b > 0 ? "sana borcu var" : b < 0 ? "fazla ödedi (sen ona borçlusun)" : "";
  $("waBtn").disabled = !c.phone || b <= 0;
  $("callBtn").disabled = !c.phone;
  const es = [...c.entries].sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);
  $("entries").innerHTML = es.length ? es.map(e => `
    <div class="entry">
      <div class="mid"><div class="note">${e.type === "borc" ? "🛒 " + esc(e.note || "Veresiye") : "💵 " + esc(e.note || "Ödeme")}</div>
      <div class="date">${niceDate(e.date)}</div></div>
      <div class="amt ${e.type === "borc" ? "debt" : "credit"}">${e.type === "borc" ? "+" : "−"}${fmt(e.amount)}</div>
      <button class="del" onclick="deleteEntry('${e.id}')" aria-label="Sil">✕</button>
    </div>`).join("") : `<div class="empty">Henüz kayıt yok.</div>`;
}

// ---- Müşteri ekle / düzenle / sil ----
function openCustForm(isEdit) {
  editing = isEdit;
  const c = isEdit ? cust() : null;
  $("custSheetTitle").textContent = isEdit ? "Müşteriyi düzenle" : "Yeni müşteri";
  $("fName").value = c ? c.name : "";
  $("fPhone").value = c ? c.phone : "";
  $("fDebt").value = "";
  $("firstDebtField").classList.toggle("hidden", isEdit);
  openSheet("custSheet"); setTimeout(() => $("fName").focus(), 250);
}
function saveCust() {
  const name = $("fName").value.trim();
  if (!name) { $("fName").focus(); return; }
  const phone = $("fPhone").value.trim();
  if (editing) { const c = cust(); c.name = name; c.phone = phone; }
  else {
    const c = { id: uid(), name, phone, entries: [] };
    const debt = parseMoney($("fDebt").value);
    if (debt) c.entries.push({ id: uid(), type: "borc", amount: debt, note: "Önceki borç", date: today(), created: Date.now() });
    db.customers.push(c); current = c.id;
  }
  save(); closeSheets(); show("cust"); renderCust();
}
function deleteCust() {
  const c = cust();
  if (!confirm(`${c.name} ve tüm hesap kayıtları silinsin mi?`)) return;
  const idx = db.customers.indexOf(c);
  db.customers.splice(idx, 1); save(); goHome();
  toast(`${c.name} silindi`, () => { db.customers.splice(idx, 0, c); save(); renderHome(); });
}

// ---- Borç yaz / ödeme al ----
function openEntry(type) {
  entryType = type;
  const c = cust(), b = balance(c);
  $("entryTitle").textContent = (type === "borc" ? "➕ Borç yaz — " : "✅ Ödeme al — ") + c.name;
  $("entrySave").className = "btn " + (type === "borc" ? "red" : "green");
  $("eAmt").value = ""; $("eNote").value = ""; $("eDate").value = today();
  $("payAll").innerHTML = type === "odeme" && b > 0
    ? `<button class="chip" onclick="$('eAmt').value='${(b / 100).toLocaleString("tr-TR")}'">Hepsini öde: ${fmt(b)}</button>` : "";
  openSheet("entrySheet"); setTimeout(() => $("eAmt").focus(), 250);
}
function saveEntry() {
  const amount = parseMoney($("eAmt").value);
  if (!amount) { $("eAmt").focus(); return; }
  cust().entries.push({ id: uid(), type: entryType, amount, note: $("eNote").value.trim(), date: $("eDate").value || today(), created: Date.now() });
  save(); closeSheets(); renderCust();
}
function deleteEntry(id) {
  const c = cust(), i = c.entries.findIndex(e => e.id === id), e = c.entries[i];
  c.entries.splice(i, 1); save(); renderCust();
  toast("Kayıt silindi", () => { c.entries.splice(i, 0, e); save(); if (current === c.id) renderCust(); });
}

// ---- WhatsApp ve arama ----
function waNumber(p) {
  let d = String(p).replace(/\D/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  if (d.startsWith("0")) d = "90" + d.slice(1);
  else if (d.length === 10 && d.startsWith("5")) d = "90" + d;
  return d;
}
function sendWhatsApp() {
  const c = cust(), b = balance(c);
  const recent = [...c.entries].sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created).slice(0, 5)
    .map(e => `• ${niceDate(e.date)}: ${e.type === "borc" ? (e.note || "Veresiye") : (e.note || "Ödeme") + " (ödeme)"} ${e.type === "borc" ? "" : "−"}${fmt(e.amount)}`);
  const shop = db.shop ? ` ${db.shop} olarak` : "";
  const msg = `Merhaba ${c.name.split(" ")[0]},${shop} hatırlatmak isteriz: hesabınızda *${fmt(b)}* bakiye bulunuyor.\n\nSon hareketler:\n${recent.join("\n")}\n\nMüsait olduğunuzda ödeyebilirsiniz. Teşekkürler 🙏`;
  location.href = `https://wa.me/${waNumber(c.phone)}?text=${encodeURIComponent(msg)}`;
}
function callCust() { location.href = "tel:" + cust().phone.replace(/[^\d+]/g, ""); }

// ---- Ayarlar ve yedek ----
function openSettings() { $("sShop").value = db.shop || ""; openSheet("setSheet"); }
function saveShop() { db.shop = $("sShop").value.trim(); save(); }
async function exportBackup() {
  saveShop();
  const name = `veresiye-yedek-${today()}.json`;
  const file = new File([JSON.stringify(db, null, 1)], name, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: "Veresiye yedeği" }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; a.click();
}
function importBackup(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.customers)) throw 0;
      // birleştir: aynı müşteri/kayıt tekrar eklenmez
      for (const c of d.customers) {
        const ex = db.customers.find(x => x.id === c.id);
        if (!ex) db.customers.push(c);
        else for (const e of c.entries) if (!ex.entries.some(y => y.id === e.id)) ex.entries.push(e);
      }
      if (!db.shop && d.shop) db.shop = d.shop;
      save(); closeSheets(); goHome(); alert("Yedek geri yüklendi ✓");
    } catch (e) { alert("Bu dosya bir Veresiye yedeği değil."); }
    input.value = "";
  };
  r.readAsText(f);
}

// ---- Pencereler ve bildirim ----
function openSheet(id) { $(id).classList.add("open"); }
function closeSheets() { document.querySelectorAll(".sheet-bg").forEach(s => s.classList.remove("open")); }
let toastTimer;
function toast(msg, undo) {
  $("toastMsg").textContent = msg;
  $("toastBtn").onclick = () => { undo(); $("toast").classList.remove("show"); };
  $("toast").classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").classList.remove("show"), 6000);
}
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if ($("entrySheet").classList.contains("open")) saveEntry();
  else if ($("custSheet").classList.contains("open")) saveCust();
});

renderHome();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");
</script>
